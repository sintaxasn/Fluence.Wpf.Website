name: Website Build

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'assets/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'LICENSE'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'assets/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'LICENSE'
      - '.github/workflows/website.yml'

# Pull request runs cancel the run they supersede. Each main run gets its own group, so it is never
# cancelled or replaced by a later push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: website/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check documentation transforms
        run: pnpm check:docs-transform

      - name: Type check
        run: pnpm typecheck

      - name: Build website
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: fluence-wpf-website
          path: website/build/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
